name: Verify iPad Safari presentation
on:
  push:
    branches: [main]
    paths:
      - 'cinematic-stories/index.html'
      - 'cinematic-stories/works.js'
      - 'cinematic-stories/check-ipad.cjs'
      - '.github/workflows/check-cinematic-ipad.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Verify JPEG decoding, layout and navigation at iPad sizes
        run: node cinematic-stories/check-ipad.cjs
      - name: Save iPad screenshots and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipad-safari-checks
          path: ipad-checks/
